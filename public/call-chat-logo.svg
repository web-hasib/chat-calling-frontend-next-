<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bubbleGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.9" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="bubbleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Outer Concentric Orbit Ring (Smooth 360 Spin) -->
  <g>
    <circle 
      cx="100" 
      cy="100" 
      r="88" 
      fill="none" 
      stroke="url(#orbitGrad)" 
      stroke-width="2.5" 
      stroke-dasharray="28 18 10 18"
      stroke-linecap="round"
      opacity="0.8"
    />
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 100 100" 
      to="360 100 100" 
      dur="5s" 
      repeatCount="indefinite" 
    />
  </g>

  <!-- 2. Main Chat Bubble (Centered at 100, 100) -->
  <g filter="url(#bubbleGlow)">
    <path 
      d="M 100 28 
         C 139.7 28, 172 60.3, 172 100 
         C 172 139.7, 139.7 172, 100 172 
         C 86.8 172, 74.4 168.4, 63.8 162.2 
         L 38 170 
         L 46.2 144.8 
         C 34.8 132.5, 28 116.9, 28 100 
         C 28 60.3, 60.3 28, 100 28 Z" 
      fill="url(#bubbleGrad)" 
    />
  </g>

  <!-- 3. Upper Gloss Highlight -->
  <path 
    d="M 100 32 
       C 136 32, 166 61, 168 97 
       C 152 56, 110 40, 52 46 
       C 65 37, 81 32, 100 32 Z" 
    fill="#FFFFFF" 
    fill-opacity="0.18" 
  />

  <!-- 4. Floating Phone Handset & Animated Waves -->
  <g>
    <!-- Smooth Handset Float Up/Down -->
    <animateTransform 
      attributeName="transform" 
      type="translate" 
      values="0,0; 0,-3; 0,0" 
      dur="2.2s" 
      repeatCount="indefinite" 
    />

    <!-- Centered Handset Path -->
    <g transform="translate(62, 62) scale(3.16)">
      <path 
        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" 
        fill="#FFFFFF" 
      />
    </g>

    <!-- Signal Wave 1 (Inner Arc) with pulsating opacity & scale -->
    <path 
      d="M 124 72 A 20 20 0 0 1 144 92" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="3.5" 
      stroke-linecap="round"
    >
      <animate 
        attributeName="opacity" 
        values="0.2; 1; 0.2" 
        dur="1.5s" 
        repeatCount="indefinite" 
      />
      <animate 
        attributeName="stroke-width" 
        values="2.5; 4.2; 2.5" 
        dur="1.5s" 
        repeatCount="indefinite" 
      />
    </path>

    <!-- Signal Wave 2 (Outer Arc) -->
    <path 
      d="M 132 58 A 36 36 0 0 1 158 84" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="3" 
      stroke-linecap="round"
    >
      <animate 
        attributeName="opacity" 
        values="0.1; 0.9; 0.1" 
        dur="1.5s" 
        begin="0.3s" 
        repeatCount="indefinite" 
      />
      <animate 
        attributeName="stroke-width" 
        values="2; 3.6; 2" 
        dur="1.5s" 
        begin="0.3s" 
        repeatCount="indefinite" 
      />
    </path>
  </g>

  <!-- 5. Green Online / Live Badge with Pulsing Ring -->
  <g>
    <!-- Pulsing Green Halo -->
    <circle cx="152" cy="50" r="7" fill="#22C55E" opacity="0.5">
      <animate 
        attributeName="r" 
        values="6; 11; 6" 
        dur="1.8s" 
        repeatCount="indefinite" 
      />
      <animate 
        attributeName="opacity" 
        values="0.6; 0; 0.6" 
        dur="1.8s" 
        repeatCount="indefinite" 
      />
    </circle>
    <!-- Solid Dot -->
    <circle cx="152" cy="50" r="6.5" fill="#22C55E" stroke="#FFFFFF" stroke-width="2.5" />
  </g>
</svg>
